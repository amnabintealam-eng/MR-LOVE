<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodnight Movie for Daniyal 💜❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
        }

        /* --- Full Screen Cinematic Stars --- */
        .sky {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            z-index: 1;
        }

        .star {
            position: absolute; background: #fff; border-radius: 50%;
            animation: twinkle var(--d) infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* --- Video-Style Containers --- */
        .scene {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 10;
            opacity: 0; pointer-events: none;
            transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(0.8);
        }

        .scene.active {
            opacity: 1; pointer-events: auto; transform: scale(1);
        }

        /* Titles */
        h1 { font-family: 'Great Vibes', cursive; font-size: 3.5rem; color: #f0e68c; text-shadow: 0 0 20px rgba(240,230,140,0.5); margin: 0; }
        .bold-text { font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-top: 10px; }

        /* Cinematic Button */
        .btn-play {
            margin-top: 30px; background: none; border: 2px solid #fff;
            color: #fff; padding: 15px 40px; border-radius: 50px;
            font-weight: 800; cursor: pointer; transition: 0.4s;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        .btn-play:hover { background: #fff; color: #000; box-shadow: 0 0 30px #fff; }

        /* Character Animations */
        .character-box { font-size: 120px; margin: 20px 0; display: block; filter: drop-shadow(0 0 20px rgba(255,255,255,0.4)); }
        
        .floating { animation: float 3s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* The Final Blur Effect */
        .final-scene { transition: filter 2s ease; }
        .blurred { filter: blur(15px); }

        .goodnight-overlay {
            position: absolute; font-size: 5rem; font-weight: 900;
            text-align: center; opacity: 0; transition: opacity 2s;
            z-index: 100; text-shadow: 0 0 50px #a020f0;
            width: 100%; pointer-events: none;
        }
        .show-gn { opacity: 1; }
    </style>
</head>
<body>

    <div class="sky" id="sky"></div>

    <div id="scene1" class="scene active">
        <h1>Just for my cute baby...</h1>
        <span class="bold-text">😘 💋</span>
        <button class="btn-play" onclick="goNext(2)">WATCH STORY 💜❤️</button>
    </div>

    <div id="scene2" class="scene">
        <span class="character-box floating">🙋‍♀️</span>
        <h1 style="font-size: 2.5rem;">Give me a hug...</h1>
        <p style="font-weight: 700; opacity: 0.8;">I'm waiting for you Malick Sahab! 🥺</p>
        <button class="btn-play" onclick="goNext(3)">HUG HER 🤗</button>
    </div>

    <div id="scene3" class="scene">
        <div id="finalWrapper" class="final-scene">
            <span class="character-box">🫂</span>
            <h1 style="font-size: 2rem; color: #fff;">Hamesha mere paas rehna...</h1>
            <p style="font-weight: 800; color: #a020f0;">💜 ❤️</p>
        </div>
        <div id="gnText" class="goodnight-overlay">
            GOODNIGHT <br> MY JAAN
        </div>
    </div>

    <script>
        // Create Stars Background
        const sky = document.getElementById('sky');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--d', Math.random() * 3 + 2 + 's');
            sky.appendChild(star);
        }

        // Logic for "Video" Transitions
        function goNext(num) {
            // Remove active class from all
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            
            // Activate the next scene
            const next = document.getElementById('scene' + num);
            next.classList.add('active');

            // If it's the final scene, trigger the "Video Ending"
            if(num === 3) {
                setTimeout(() => {
                    document.getElementById('finalWrapper').classList.add('blurred');
                    document.getElementById('gnText').classList.add('show-gn');
                }, 2000); // Wait 2 seconds before blurring (like a movie ending)
            }
        }
    </script>
</body>
</html>
