<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodnight Movie for Daniyal 💜❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: #fff;
        }

        /* --- Cinematic Night Sky --- */
        .sky {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            z-index: 1;
        }

        .star {
            position: absolute; background: #fff; border-radius: 50%;
            animation: twinkle var(--d) infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* --- Video-Style Scenes --- */
        .scene {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 10;
            opacity: 0; pointer-events: none;
            transition: all 1.2s ease-in-out;
            transform: translateY(20px);
        }

        .scene.active {
            opacity: 1; pointer-events: auto; transform: translateY(0);
        }

        h1 { font-family: 'Great Vibes', cursive; font-size: 3rem; color: #f0e68c; text-shadow: 0 0 20px rgba(240,230,140,0.5); margin: 0; }
        
        /* --- Cartoon/Sticker Styling --- */
        .cartoon-img {
            width: 200px; /* Bada size cartoon ke liye */
            height: auto;
            margin: 20px 0;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));
            border-radius: 20px;
        }

        .btn-play {
            margin-top: 30px; background: none; border: 2px solid #fff;
            color: #fff; padding: 12px 35px; border-radius: 50px;
            font-weight: 800; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 2px;
            font-family: 'Montserrat', sans-serif;
        }
        .btn-play:hover { background: #fff; color: #000; box-shadow: 0 0 30px #fff; }

        /* Final Scene Effects */
        .final-wrapper { transition: filter 2s ease; }
        .blurred { filter: blur(12px); opacity: 0.5; }

        .gn-overlay {
            position: absolute; font-family: 'Montserrat', sans-serif;
            font-size: 4rem; font-weight: 900; color: #fff;
            opacity: 0; transition: opacity 2s; z-index: 100;
            text-shadow: 0 0 40px #a020f0; width: 100%; pointer-events: none;
        }
        .show-gn { opacity: 1; }
    </style>
</head>
<body>

    <div class="sky" id="sky"></div>

    <div id="scene1" class="scene active">
        <h1>Just for my cute baby...</h1>
        <p style="font-weight: 800; font-family: 'Montserrat';">😘 💋 💜❤️</p>
        <button class="btn-play" onclick="goNext(2)">OPEN SURPRISE ✨</button>
    </div>

    <div id="scene2" class="scene">
        <img src="https://media.tenor.com/7bN8-6Yv_7kAAAAj/cute-girl.gif" class="cartoon-img" alt="Cute Girl">
        <h1 style="font-size: 2.5rem;">Give me a hug...</h1>
        <p style="font-weight: 700; color: #eee; font-family: 'Montserrat';">I'm waiting for you Malick Sahab! 🥺</p>
        <button class="btn-play" onclick="goNext(3)">HUG ME 🤗</button>
    </div>

    <div id="scene3" class="scene">
        <div id="finalWrapper" class="final-wrapper">
            <img src="https://media.tenor.com/6v30O-L5mXoAAAAj/hug.gif" class="cartoon-img" alt="Hug">
            <h1 style="font-size: 2rem;">Hamesha mere paas rehna...</h1>
            <p style="font-weight: 900; color: #a020f0; font-family: 'Montserrat';">💜 ❤️</p>
        </div>
        <div id="gnText" class="gn-overlay">
            GOODNIGHT <br> MY JANU BABY
        </div>
    </div>

    <script>
        // Stars background
        const sky = document.getElementById('sky');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--d', Math.random() * 3 + 2 + 's');
            sky.appendChild(star);
        }

        // Scene Logic
        function goNext(num) {
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            document.getElementById('scene' + num).classList.add('active');

            if(num === 3) {
                setTimeout(() => {
                    document.getElementById('finalWrapper').classList.add('blurred');
                    document.getElementById('gnText').classList.add('show-gn');
                }, 2500); // 2.5 seconds hug then blur
            }
        }
    </script>
</body>
</html>
