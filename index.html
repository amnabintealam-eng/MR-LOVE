<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodnight My Jaan 💜❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: #000b1e; /* Night Sky Color */
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            text-align: center;
        }

        /* --- Twinkling Stars Animation --- */
        .stars-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }
        .star {
            position: absolute; background: white;
            border-radius: 50%; opacity: 0;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* --- Pages Layout --- */
        .page {
            position: relative; z-index: 10;
            width: 90%; max-width: 450px;
            display: none; flex-direction: column; align-items: center;
            animation: fadeIn 1.5s ease-in-out;
        }
        .active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h1 { font-family: 'Great Vibes', cursive; font-size: 3.5rem; color: #f0e68c; text-shadow: 0 0 15px rgba(240, 230, 140, 0.6); }
        .main-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #fff; padding: 15px 30px;
            border-radius: 50px; color: #fff; font-weight: 800;
            cursor: pointer; transition: 0.3s; margin-top: 20px;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        .main-btn:hover { background: #fff; color: #000b1e; }

        /* --- Cute Characters Styling --- */
        .character-box { font-size: 100px; margin: 20px 0; display: block; }
        .hug-scene { transition: 1s ease-in-out; }
        .blurred { filter: blur(8px); opacity: 0.6; }

        .gn-text {
            font-size: 4.5rem; font-weight: 900;
            background: linear-gradient(45deg, #fff, #a020f0, #ff4d4d);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; z-index: 20;
        }
    </style>
</head>
<body>

    <div class="stars-container" id="stars"></div>

    <div id="page1" class="page active">
        <h1>JUST FOR MY CUTE BABY 😘💋</h1>
        <button class="main-btn" onclick="nextPage(2)">CLICK HERE 💜❤️</button>
    </div>

    <div id="page2" class="page">
        <span class="character-box">🙋‍♀️🏽‍♂️</span>
        <h2 style="font-size: 2rem;">Give me a hug... 🥺💜</h2>
        <p>I'm waiting for you Malick Sahab!</p>
        <button class="main-btn" onclick="nextPage(3)">Go for Hug 🤗</button>
    </div>

    <div id="page3" class="page" style="position: relative;">
        <div id="scene" class="hug-scene">
            <span class="character-box">🫂💜❤️</span>
            <p style="font-weight: 700;">Hamesha mere paas rehna...</p>
        </div>
        
        <div id="goodnight" class="gn-text" style="display: none;">GOODNIGHT <br> JAANU</div>
    </div>

    <script>
        // --- Create Stars ---
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
            starsContainer.appendChild(star);
        }

        // --- Page Navigation ---
        function nextPage(num) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + num).classList.add('active');

            if(num === 3) {
                // Blur the couple and show Goodnight after a small delay
                setTimeout(() => {
                    document.getElementById('scene').classList.add('blurred');
                    document.getElementById('goodnight').style.display = 'block';
                    document.getElementById('goodnight').style.animation = 'fadeIn 2s forwards';
                }, 1500);
            }
        }
    </script>
</body>
</html>
